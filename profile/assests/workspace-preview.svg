<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NewWorldGPT workspace preview</title>
  <desc id="desc">A preview of the NewWorldGPT congregation workspace with channel navigation, posts, decisions, action items, knowledge base, and assistant chat.</desc>
  <rect width="1440" height="900" fill="#f6f3f7"/>

  <rect x="44" y="40" width="1352" height="820" rx="6" fill="#fbfafc" stroke="#ded8e2"/>
  <rect x="44" y="40" width="232" height="820" rx="6" fill="#f0edf2"/>
  <line x1="276" y1="40" x2="276" y2="860" stroke="#ded8e2"/>

  <text x="72" y="82" fill="#918a95" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORKSPACE</text>
  <text x="72" y="112" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="22" font-weight="700">NewWorldGPT</text>
  <line x1="44" y1="138" x2="276" y2="138" stroke="#ded8e2"/>

  <text x="72" y="179" fill="#918a95" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PINE VALLEY</text>
  <g font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="16">
    <rect x="60" y="200" width="200" height="34" rx="5" fill="#e7e1e9"/>
    <text x="78" y="222" fill="#29252c" font-weight="700"># shepherding</text>
    <text x="78" y="264" fill="#6e6872"># service</text>
    <text x="78" y="304" fill="#6e6872"># announcements</text>
    <text x="78" y="344" fill="#6e6872"># building</text>
  </g>
  <line x1="60" y1="384" x2="260" y2="384" stroke="#ded8e2"/>
  <text x="78" y="424" fill="#6e6872" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15">Settings</text>
  <text x="78" y="464" fill="#6e6872" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15">App Admin</text>

  <circle cx="84" cy="810" r="18" fill="#5d3e68"/>
  <text x="75" y="817" fill="#fffafd" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="13" font-weight="700">RB</text>
  <text x="114" y="807" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15" font-weight="700">R. Brooks</text>
  <text x="114" y="828" fill="#918a95" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12">admin</text>

  <g transform="translate(276 40)">
    <rect x="0" y="0" width="1120" height="74" fill="#fbfafc"/>
    <text x="34" y="45" fill="#918a95" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="20">#</text>
    <text x="58" y="46" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="24" font-weight="700">shepherding</text>
    <text x="214" y="46" fill="#918a95" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">12 members</text>
    <line x1="0" y1="74" x2="1120" y2="74" stroke="#ded8e2"/>

    <g transform="translate(34 96)" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif">
      <rect x="0" y="0" width="72" height="34" rx="5" fill="#e7e1e9"/>
      <text x="21" y="22" fill="#29252c" font-size="14" font-weight="700">Posts</text>
      <text x="104" y="22" fill="#6e6872" font-size="14">Decisions</text>
      <text x="206" y="22" fill="#6e6872" font-size="14">Actions</text>
      <text x="300" y="22" fill="#6e6872" font-size="14">Ask</text>
      <text x="360" y="22" fill="#6e6872" font-size="14">KB</text>
    </g>
    <line x1="0" y1="148" x2="1120" y2="148" stroke="#ded8e2"/>

    <g transform="translate(34 184)">
      <text x="0" y="0" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="22" font-weight="700">Posts</text>
      <text x="0" y="27" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">Questions, proposals, and decisions stay attached to the channel.</text>

      <rect x="0" y="58" width="612" height="122" rx="6" fill="#ffffff" stroke="#ded8e2"/>
      <rect x="22" y="82" width="70" height="26" rx="5" fill="#edf6f0" stroke="#cddfd4"/>
      <text x="39" y="100" fill="#2f7a4b" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700">DECISION</text>
      <text x="22" y="134" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="18" font-weight="700">Coordinate a meal rotation for the Morales family</text>
      <text x="22" y="161" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">Verified answer linked. 8 votes. 3 comments.</text>

      <rect x="0" y="198" width="612" height="122" rx="6" fill="#ffffff" stroke="#ded8e2"/>
      <rect x="22" y="222" width="72" height="26" rx="5" fill="#f7efe2" stroke="#ead6b4"/>
      <text x="39" y="240" fill="#8a5b13" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700">ACTION</text>
      <text x="22" y="274" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="18" font-weight="700">Confirm transportation for Thursday visit</text>
      <text x="22" y="301" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">Assigned to M. Reyes. Due Friday.</text>

      <rect x="0" y="338" width="612" height="122" rx="6" fill="#ffffff" stroke="#ded8e2"/>
      <rect x="22" y="362" width="50" height="26" rx="5" fill="#eff5fb" stroke="#cddceb"/>
      <text x="38" y="380" fill="#2d6d9f" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700">POST</text>
      <text x="22" y="414" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="18" font-weight="700">Notes from hospital liaison call</text>
      <text x="22" y="441" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">Private channel context for assigned elders.</text>
    </g>

    <g transform="translate(696 184)">
      <rect x="0" y="0" width="380" height="226" rx="6" fill="#ffffff" stroke="#ded8e2"/>
      <text x="22" y="38" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="18" font-weight="700">Knowledge base</text>
      <text x="22" y="65" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="13">Channel-scoped documents with indexing status.</text>
      <line x1="0" y1="86" x2="380" y2="86" stroke="#ded8e2"/>
      <text x="22" y="121" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14" font-weight="700">visit-guidelines.pdf</text>
      <text x="266" y="121" fill="#2f7a4b" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700">ACTIVE</text>
      <text x="22" y="154" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14" font-weight="700">emergency-contacts.csv</text>
      <text x="266" y="154" fill="#2d6d9f" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700">PROCESSING</text>
      <text x="22" y="187" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14" font-weight="700">care-schedule.md</text>
      <text x="266" y="187" fill="#2f7a4b" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="12" font-weight="700">ACTIVE</text>

      <rect x="0" y="254" width="380" height="292" rx="6" fill="#ffffff" stroke="#ded8e2"/>
      <text x="22" y="292" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="18" font-weight="700">@agent</text>
      <text x="108" y="292" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="13">answers from channel knowledge</text>
      <rect x="22" y="322" width="286" height="54" rx="6" fill="#e7e1e9"/>
      <text x="40" y="354" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">What changed in the visit schedule?</text>
      <rect x="72" y="396" width="286" height="92" rx="6" fill="#f3f0f5"/>
      <text x="92" y="428" fill="#29252c" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14">Two Thursday visits moved later.</text>
      <text x="92" y="454" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="13">Sources: care-schedule.md, notes.</text>
      <rect x="22" y="510" width="336" height="1" fill="#ded8e2"/>
      <text x="22" y="535" fill="#918a95" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="13">Message... or @agent &lt;question&gt;</text>
    </g>
