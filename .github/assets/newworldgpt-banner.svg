<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">NewWorldGPT organization banner</title>
  <desc id="desc">A calm banner for NewWorldGPT, a private AI workspace for congregation care.</desc>
  <rect width="1280" height="360" fill="#fbfafc"/>
  <rect x="0" y="0" width="1280" height="360" fill="#f6f3f7"/>
  <rect x="72" y="54" width="1136" height="252" rx="6" fill="#fbfafc" stroke="#e5e0e7"/>
  <rect x="72" y="54" width="220" height="252" rx="6" fill="#f1edf3"/>
  <rect x="72" y="54" width="220" height="252" rx="6" fill="none" stroke="#e5e0e7"/>

  <text x="112" y="106" fill="#8f8794" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CONGREGATION WORKSPACES</text>
  <text x="112" y="158" fill="#272329" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="54" font-weight="700">NewWorldGPT</text>
  <text x="114" y="196" fill="#625b66" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="22">Private AI for knowledge, decisions, and follow-through.</text>

  <g transform="translate(112 232)">
    <rect x="0" y="0" width="132" height="38" rx="6" fill="#5d3e68"/>
    <text x="20" y="25" fill="#fffafd" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15" font-weight="700">channels</text>
    <rect x="146" y="0" width="146" height="38" rx="6" fill="#f0e7f4" stroke="#d9cfdf"/>
    <text x="166" y="25" fill="#5d3e68" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15" font-weight="700">knowledge base</text>
    <rect x="306" y="0" width="102" height="38" rx="6" fill="#edf6f0" stroke="#cddfd4"/>
    <text x="326" y="25" fill="#2f7a4b" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="15" font-weight="700">@agent</text>
  </g>

  <g transform="translate(812 80)">
    <rect x="0" y="0" width="332" height="202" rx="6" fill="#ffffff" stroke="#e5e0e7"/>
    <rect x="0" y="0" width="332" height="42" rx="6" fill="#f7f4f8"/>
    <circle cx="28" cy="21" r="5" fill="#5d3e68"/>
    <circle cx="48" cy="21" r="5" fill="#c58a36"/>
    <circle cx="68" cy="21" r="5" fill="#3d83b7"/>
    <text x="24" y="75" fill="#272329" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="19" font-weight="700">Pine Valley Congregation</text>
    <text x="24" y="102" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14"># shepherding</text>
    <rect x="24" y="126" width="284" height="1" fill="#ebe6ed"/>
    <text x="24" y="154" fill="#272329" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="14" font-weight="700">Review family support plan</text>
    <text x="24" y="178" fill="#716a75" font-family="Atkinson Hyperlegible, Inter, Arial, sans-serif" font-size="13">Decision recorded. Two action items open.</text>
  </g>
